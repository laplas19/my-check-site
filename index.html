<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banken & Schufa Check</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        h2 { color: #00ff88; margin-bottom: 25px; font-size: 24px; }
        .question { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2d2d2d;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus { border-color: #00ff88; }
        .btn {
            background-color: #25d366;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1da851; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        .footer-text { font-size: 12px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Datenprüfung</h2>
    
    <div class="question">
        <label>Haben Sie bereits Konten bei anderen Banken eröffnet?</label>
        <input type="text" id="banks" placeholder="Z.B. Revolut, N26, keine...">
    </div>

    <div class="question">
        <label>Wie ist Ihr SCHUFA-Status?</label>
        <select id="schufa">
            <option value="Gut">Gut (Positiv)</option>
            <option value="Mittelmäßig">Mittelmäßig</option>
            <option value="Schlecht">Schlecht (Negativ)</option>
            <option value="Weiß nicht">Ich weiß nicht</option>
        </select>
    </div>

    <button class="btn" id="submitBtn" onclick="sendData(event)">Per WhatsApp senden</button>
    
    <p class="footer-text">Klicken Sie auf den Button, um die Daten zu senden.</p>
</div>

<script>
    function sendData(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyy9Xq5Mt0EVSavjKz6UxfJ0KeppbTUtGHmTlBT4aq64H33CjZw16qFO2J0jPTaLQKfcw/exec';
        
        const banks = document.getElementById('banks').value || "Keine Angabe";
        const schufa = document.getElementById('schufa').value;
        const phoneNumber = "49123456789"; // <--- ЗАМЕНИ ЭТОТ НОМЕР НА СВОЙ!

        btn.disabled = true;
        btn.innerText = "Laden...";

        // 1. Отправка в Google Таблицу
        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new URLSearchParams({ 'banks': banks, 'schufa': schufa })
        })
        .then(() => {
            // 2. Открытие WhatsApp через полсекунды
            setTimeout(() => {
                const text = encodeURIComponent(`Hallo! Ich habe das Formular ausgefüllt.\n\nDetails:\n- Banken: ${banks}\n- SCHUFA: ${schufa}`);
                window.open(`https://wa.me/${phoneNumber}?text=${text}`, '_blank');
                
                btn.disabled = false;
                btn.innerText = "Per WhatsApp senden";
            }, 500);
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Fehler! Попробуйте еще раз.');
            btn.disabled = false;
            btn.innerText = "Per WhatsApp senden";
        });
    }
</script>

</body>
</html>
